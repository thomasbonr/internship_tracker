<!DOCTYPE html>
<html lang="en" class="bg-gray-50 text-gray-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internship Tracker</title>
    <!--
      Tailwind Play CDN: generates CSS dynamically from DOM — SRI is not compatible
      with this CDN by design. For production hardening, replace with a compiled
      Tailwind CSS file built via `npx tailwindcss -o public/tailwind.css --minify`
      and a <link> tag with an integrity attribute.
    -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js served locally from node_modules (no external CDN dependency) -->
    <script src="/js/chart.min.js"></script>
</head>
<body class="p-8 max-w-7xl mx-auto">

<h1 class="text-3xl font-bold mb-8 text-indigo-600">&#x1F680; Internship Tracker</h1>

<!-- Overview -->
<div class="bg-white p-6 rounded-lg shadow-md mb-8">
    <h2 class="text-xl font-semibold mb-4">Application Overview</h2>
    <div class="flex flex-col lg:flex-row items-center gap-8">
        <div class="relative w-72 h-72 flex-shrink-0">
            <canvas id="statusChart"></canvas>
        </div>
        <div id="statsCards" class="grid grid-cols-2 gap-4 w-full"></div>
    </div>
</div>

<!-- Add form -->
<div class="bg-white p-6 rounded-lg shadow-md mb-8">
    <h2 class="text-xl font-semibold mb-4">Add New Application</h2>
    <form id="addForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
        <input type="text" id="company" placeholder="Company Name" required maxlength="200" class="border p-2 rounded focus:ring focus:ring-indigo-200 outline-none">
        <input type="text" id="title" placeholder="Job Title" required maxlength="200" class="border p-2 rounded focus:ring focus:ring-indigo-200 outline-none">
        <input type="text" id="location" placeholder="Location (e.g., Remote, Paris)" maxlength="200" class="border p-2 rounded focus:ring focus:ring-indigo-200 outline-none">
        <input type="date" id="date" required class="border p-2 rounded focus:ring focus:ring-indigo-200 outline-none">
        <input type="url" id="link" placeholder="Job URL" maxlength="2048" class="border p-2 rounded focus:ring focus:ring-indigo-200 outline-none lg:col-span-2">
        <select id="status" class="border p-2 rounded focus:ring focus:ring-indigo-200 outline-none"></select>
        <button type="submit" class="bg-indigo-600 text-white font-semibold p-2 rounded hover:bg-indigo-700 transition">Add Application</button>
        <textarea id="details" placeholder="Notes (e.g., Tech stack, recruiter name)" maxlength="5000" class="border p-2 rounded focus:ring focus:ring-indigo-200 outline-none lg:col-span-4 h-20"></textarea>
    </form>
</div>

<!-- Table -->
<div class="bg-white rounded-lg shadow-md overflow-x-auto">
    <div class="p-4 border-b bg-gray-50 flex flex-col md:flex-row gap-3 md:items-center md:justify-between flex-wrap">
        <div class="flex flex-wrap items-center gap-3">
            <div class="flex items-center gap-2">
                <label for="statusFilter" class="text-sm font-medium text-gray-700">Status:</label>
                <select id="statusFilter" class="border p-2 rounded text-sm focus:ring focus:ring-indigo-200 outline-none">
                    <option value="all">All</option>
                </select>
            </div>
            <div class="flex items-center gap-2">
                <label for="sortBy" class="text-sm font-medium text-gray-700">Sort:</label>
                <select id="sortBy" class="border p-2 rounded text-sm focus:ring focus:ring-indigo-200 outline-none">
                    <option value="date_desc">Date (Newest)</option>
                    <option value="date_asc">Date (Oldest)</option>
                    <option value="company_asc">Company (A-Z)</option>
                    <option value="status">Status</option>
                </select>
            </div>
            <input type="search" id="searchInput" placeholder="Search company or title…" class="border p-2 rounded text-sm focus:ring focus:ring-indigo-200 outline-none w-56">
        </div>
        <div class="flex items-center gap-2">
            <label class="text-sm px-3 py-2 rounded border border-gray-300 hover:bg-gray-100 transition font-medium text-gray-700 cursor-pointer">
                &#x2B06; Import
                <input type="file" id="importFile" accept=".json,.csv" class="hidden">
            </label>
            <button onclick="exportJSON()" class="text-sm px-3 py-2 rounded border border-gray-300 hover:bg-gray-100 transition font-medium text-gray-700">&#x2B07; JSON</button>
            <button onclick="exportCSV()" class="text-sm px-3 py-2 rounded border border-gray-300 hover:bg-gray-100 transition font-medium text-gray-700">&#x2B07; CSV</button>
        </div>
    </div>
    <table class="w-full text-left border-collapse">
        <thead>
            <tr class="bg-gray-100 border-b">
                <th class="p-4">Date</th>
                <th class="p-4">Company</th>
                <th class="p-4">Title / Location</th>
                <th class="p-4">Link</th>
                <th class="p-4">Status</th>
                <th class="p-4">Actions</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<!-- Import result toast -->
<div id="toast" class="hidden fixed bottom-6 right-6 max-w-sm bg-white border rounded-lg shadow-lg p-4 z-50">
    <div id="toastMsg" class="text-sm"></div>
    <button onclick="hideToast()" class="absolute top-2 right-3 text-gray-400 hover:text-gray-700 text-lg leading-none">&times;</button>
</div>

<script>
// ─── Status config (loaded from server, single source of truth) ───────────────
let STATUS_ORDER  = [];
let STATUS_MAP    = {};

const EMPTY_CHART_LABEL = 'No Applications Yet';
let statusChartInstance = null;
let allApplications     = [];
const editingDetailsIds = new Set();

// ─── Chart plugin ─────────────────────────────────────────────────────────────
const centerTextPlugin = {
    id: 'centerText',
    afterDraw(chart, args, pluginOptions) {
        const { ctx, chartArea } = chart;
        if (!chartArea) return;
        const centerX    = (chartArea.left + chartArea.right) / 2;
        const centerY    = (chartArea.top  + chartArea.bottom) / 2;
        const totalValue = chart.config.data.actualTotal ?? 0;
        const label      = pluginOptions?.label || 'Total';
        ctx.save();
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#6b7280';
        ctx.font = '500 14px system-ui, -apple-system, Segoe UI, sans-serif';
        ctx.fillText(label, centerX, centerY - 16);
        ctx.fillStyle = '#1f2937';
        ctx.font = '700 36px system-ui, -apple-system, Segoe UI, sans-serif';
        ctx.fillText(String(totalValue), centerX, centerY + 14);
        ctx.restore();
    },
};

// ─── Utilities ────────────────────────────────────────────────────────────────
function escapeHTML(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/[&<>'"]/g, (c) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c]));
}

function safeLink(url) {
    if (!url) return '';
    try {
        const parsed = new URL(url, window.location.origin);
        return ['http:', 'https:'].includes(parsed.protocol.toLowerCase()) ? parsed.href : '';
    } catch (_) { return ''; }
}

function normalizeStatusClient(rawStatus) {
    const value = String(rawStatus || '').toLowerCase().trim();
    return STATUS_MAP[value] ? value : (STATUS_ORDER[0] || 'applied');
}

function isoDateStamp() { return new Date().toISOString().slice(0, 10); }

function downloadFile(content, filename, mimeType) {
    const blob = new Blob([content], { type: mimeType });
    const url  = URL.createObjectURL(blob);
    const a    = Object.assign(document.createElement('a'), { href: url, download: filename });
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

function csvCell(value) {
    const str = String(value ?? '');
    return (str.includes(',') || str.includes('"') || str.includes('\n') || str.includes('\r'))
        ? '"' + str.replace(/"/g, '""') + '"'
        : str;
}

// ─── Toast ────────────────────────────────────────────────────────────────────
let toastTimer = null;

function showToast(html, isError = false) {
    const el  = document.getElementById('toast');
    const msg = document.getElementById('toastMsg');
    msg.innerHTML = html;
    el.className = `fixed bottom-6 right-6 max-w-sm bg-white border rounded-lg shadow-lg p-4 z-50 ${isError ? 'border-red-300' : 'border-green-300'}`;
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 6000);
}

function hideToast() {
    document.getElementById('toast').classList.add('hidden');
}

// ─── Status helpers ───────────────────────────────────────────────────────────
function renderStatusOptions(selectedStatus) {
    return STATUS_ORDER
        .map((key) => `<option value="${key}" ${selectedStatus === key ? 'selected' : ''}>${escapeHTML(STATUS_MAP[key].label)}</option>`)
        .join('');
}

function initStatusSelect() {
    document.getElementById('status').innerHTML = renderStatusOptions(STATUS_ORDER[0] || 'applied');
}

function initStatusFilter() {
    document.getElementById('statusFilter').innerHTML =
        `<option value="all">All</option>` +
        STATUS_ORDER.map((key) => `<option value="${key}">${escapeHTML(STATUS_MAP[key].label)}</option>`).join('');
}

// ─── Error parsing ────────────────────────────────────────────────────────────
async function parseErrorResponse(res) {
    const text = await res.text();
    let message = `HTTP ${res.status}`;
    try { message = JSON.parse(text).error || message; } catch (_) {}
    return new Error(message);
}

// ─── Filtering & sorting ──────────────────────────────────────────────────────
function getVisibleApplications() {
    const filterValue = document.getElementById('statusFilter').value;
    const sortValue   = document.getElementById('sortBy').value;
    const searchValue = document.getElementById('searchInput').value.trim().toLowerCase();

    let data = allApplications.filter((app) => {
        const status = normalizeStatusClient(app.status);
        if (filterValue !== 'all' && status !== filterValue) return false;
        if (searchValue) {
            const company = String(app.company || '').toLowerCase();
            const title   = String(app.title   || '').toLowerCase();
            if (!company.includes(searchValue) && !title.includes(searchValue)) return false;
        }
        return true;
    });

    return [...data].sort((a, b) => {
        if (sortValue === 'date_asc')    return String(a.date_applied || '').localeCompare(String(b.date_applied || ''));
        if (sortValue === 'company_asc') return String(a.company      || '').localeCompare(String(b.company      || ''));
        if (sortValue === 'status')      return STATUS_ORDER.indexOf(normalizeStatusClient(a.status)) - STATUS_ORDER.indexOf(normalizeStatusClient(b.status));
        return String(b.date_applied || '').localeCompare(String(a.date_applied || ''));
    });
}

// ─── Table rendering ──────────────────────────────────────────────────────────
function renderTable(data) {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    if (data.length === 0) {
        tbody.innerHTML = `<tr class="border-b"><td class="p-6 text-center text-gray-500 italic" colspan="6">No applications found.</td></tr>`;
        return;
    }

    data.forEach((app) => {
        const tr           = document.createElement('tr');
        tr.className       = 'border-b hover:bg-gray-50';
        const normalizedLink = safeLink(app.link);
        const statusKey    = normalizeStatusClient(app.status);
        const statusData   = STATUS_MAP[statusKey];
        const isEditing    = editingDetailsIds.has(app.id);
        const detailsValue = app.details || '';

        tr.innerHTML = `
            <td class="p-4 whitespace-nowrap text-sm text-gray-600">${escapeHTML(app.date_applied || '-')}</td>
            <td class="p-4 font-semibold">${escapeHTML(app.company)}</td>
            <td class="p-4">
                <div class="text-sm text-gray-900">${escapeHTML(app.title)}</div>
                <div class="text-xs text-gray-500">${escapeHTML(app.location)}</div>
                <div id="details-${app.id}" class="mt-1">
                    ${isEditing
                        ? `<textarea id="details-input-${app.id}" class="w-full border p-2 rounded text-xs focus:ring focus:ring-indigo-200 outline-none h-20">${escapeHTML(detailsValue)}</textarea>`
                        : (detailsValue
                            ? `<div class="text-xs text-gray-400 italic">&#x1F4DD; ${escapeHTML(detailsValue)}</div>`
                            : '<div class="text-xs text-gray-300 italic">No details yet</div>')}
                </div>
            </td>
            <td class="p-4">
                ${normalizedLink ? `<a href="${escapeHTML(normalizedLink)}" target="_blank" rel="noopener noreferrer" class="text-indigo-600 hover:underline text-sm">View Job</a>` : '-'}
            </td>
            <td class="p-4">
                <select data-prev-value="${statusKey}" onchange="updateStatus(${app.id}, this.value, this)"
                    class="text-sm font-medium px-2 py-1 rounded-full outline-none ${statusData.css} appearance-none cursor-pointer">
                    ${renderStatusOptions(statusKey)}
                </select>
            </td>
            <td class="p-4">
                ${isEditing
                    ? `<button onclick="saveDetails(${app.id}, this)" class="text-green-600 hover:text-green-800 text-sm font-semibold transition mr-3">Save</button>
                       <button onclick="cancelEditDetails(${app.id})" class="text-gray-500 hover:text-gray-700 text-sm font-semibold transition mr-3">Cancel</button>
                       <button onclick="deleteApp(${app.id})" class="text-red-500 hover:text-red-700 text-sm font-semibold transition">Delete</button>`
                    : `<button onclick="startEditDetails(${app.id})" class="text-indigo-600 hover:text-indigo-800 text-sm font-semibold transition mr-3">Edit</button>
                       <button onclick="deleteApp(${app.id})" class="text-red-500 hover:text-red-700 text-sm font-semibold transition">Delete</button>`}
            </td>
        `;
        tbody.appendChild(tr);
    });
}

// ─── Stats cards ──────────────────────────────────────────────────────────────
function renderStats(data) {
    const total  = data.length;
    const counts = Object.fromEntries(STATUS_ORDER.map((k) => [k, 0]));
    data.forEach((app) => { counts[normalizeStatusClient(app.status)] += 1; });

    const responded    = (counts.assessment || 0) + (counts.interview || 0) + (counts.offer || 0) + (counts.refused || 0);
    const active       = (counts.applied    || 0) + (counts.assessment || 0) + (counts.interview || 0);
    const responseRate = total ? Math.round((responded / total) * 100) : 0;
    const offerRate    = total ? Math.round(((counts.offer || 0) / total) * 100) : 0;
    const ghostedRate  = total ? Math.round(((counts.ghosted || 0) / total) * 100) : 0;

    const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 30);
    const last30 = data.filter((app) => app.date_applied && app.date_applied >= cutoff.toISOString().slice(0, 10)).length;

    const cards = [
        { label: 'Response rate',   value: total ? `${responseRate}%` : '—', sub: total ? `${responded} of ${total} replied` : 'no applications yet', color: 'text-indigo-600' },
        { label: 'Offer rate',      value: total ? `${offerRate}%`    : '—', sub: `${counts.offer || 0} offer${(counts.offer || 0) !== 1 ? 's' : ''} received`,   color: 'text-green-600' },
        { label: 'Ghosted',         value: total ? `${ghostedRate}%`  : '—', sub: `${counts.ghosted || 0} ghosted`,       color: 'text-gray-500' },
        { label: 'Active pipeline', value: String(active),                    sub: 'applied · assessment · interview',     color: 'text-purple-600' },
        { label: 'Last 30 days',    value: String(last30),                    sub: 'applications sent',                    color: 'text-orange-500' },
        { label: 'Total',           value: String(total),                     sub: 'all time',                             color: 'text-gray-700' },
    ];

    document.getElementById('statsCards').innerHTML = cards.map(({ label, value, sub, color }) => `
        <div class="bg-gray-50 rounded-lg p-4">
            <div class="text-sm text-gray-500 mb-1">${label}</div>
            <div class="text-3xl font-bold ${color}">${value}</div>
            <div class="text-xs text-gray-400 mt-1">${sub}</div>
        </div>
    `).join('');
}

// ─── Dashboard ────────────────────────────────────────────────────────────────
function updateDashboard(data) {
    const counts      = Object.fromEntries(STATUS_ORDER.map((k) => [k, 0]));
    data.forEach((app) => { counts[normalizeStatusClient(app.status)] += 1; });

    const labels      = data.length === 0 ? [EMPTY_CHART_LABEL]                        : STATUS_ORDER.map((k) => STATUS_MAP[k].label);
    const chartValues = data.length === 0 ? [1]                                         : STATUS_ORDER.map((k) => counts[k]);
    const chartColors = data.length === 0 ? ['#d1d5db']                                 : STATUS_ORDER.map((k) => STATUS_MAP[k].chartColor);

    const ctx = document.getElementById('statusChart').getContext('2d');
    if (statusChartInstance) statusChartInstance.destroy();

    statusChartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: { actualTotal: data.length, labels, datasets: [{ data: chartValues, backgroundColor: chartColors, borderWidth: 0, cutout: '75%', hoverOffset: 4 }] },
        plugins: [centerTextPlugin],
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: {
                centerText: { label: 'Total' },
                legend: { position: 'right', labels: { usePointStyle: true, padding: 20 } },
                tooltip: { callbacks: { label(ctx) {
                    const pct = data.length ? Math.round((ctx.parsed / data.length) * 100) : 0;
                    return `${ctx.label ? ctx.label + ': ' : ''}${ctx.parsed} (${pct}%)`;
                }}},
            },
        },
    });

    renderStats(data);
}

// ─── Data fetching ────────────────────────────────────────────────────────────
async function fetchStatuses() {
    const res  = await fetch('/api/statuses');
    if (!res.ok) throw new Error('Failed to load status configuration');
    const list = await res.json();
    STATUS_ORDER = list.map((s) => s.key);
    STATUS_MAP   = Object.fromEntries(list.map((s) => [s.key, s]));
}

async function fetchApplications() {
    try {
        const res = await fetch('/api/applications');
        if (!res.ok) throw await parseErrorResponse(res);
        let data;
        try { data = JSON.parse(await res.text()); } catch (_) {
            throw new Error('Server returned invalid JSON');
        }
        allApplications = Array.isArray(data) ? data : [];
        updateDashboard(allApplications);
        renderTable(getVisibleApplications());
    } catch (error) {
        console.error('Error fetching applications:', error);
        alert('Failed to load applications. Please check if the server is running.');
    }
}

// ─── Add form ─────────────────────────────────────────────────────────────────
document.getElementById('addForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type="submit"]');
    const orig = btn.innerText;
    btn.innerText = 'Adding…'; btn.disabled = true;
    try {
        const res = await fetch('/api/applications', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                company:      document.getElementById('company').value,
                title:        document.getElementById('title').value,
                location:     document.getElementById('location').value,
                link:         document.getElementById('link').value,
                date_applied: document.getElementById('date').value,
                status:       normalizeStatusClient(document.getElementById('status').value),
                details:      document.getElementById('details').value,
            }),
        });
        if (!res.ok) throw await parseErrorResponse(res);
        e.target.reset();
        initStatusSelect();
        document.getElementById('date').valueAsDate = new Date();
        await fetchApplications();
    } catch (error) {
        console.error('Add application error:', error);
        alert(`Failed to add: ${error.message}`);
    } finally {
        btn.innerText = orig; btn.disabled = false;
    }
});

// ─── Status update ────────────────────────────────────────────────────────────
async function updateStatus(id, newStatus, selectElement) {
    const prev = selectElement.getAttribute('data-prev-value');
    selectElement.disabled = true;
    try {
        const res = await fetch(`/api/applications/${id}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: normalizeStatusClient(newStatus) }),
        });
        if (!res.ok) throw await parseErrorResponse(res);
        selectElement.setAttribute('data-prev-value', newStatus);
        await fetchApplications();
    } catch (error) {
        console.error('Update status error:', error);
        alert(`Failed to update status: ${error.message}`);
        if (prev) selectElement.value = prev;
    } finally { selectElement.disabled = false; }
}

// ─── Details editing ──────────────────────────────────────────────────────────
function startEditDetails(id)  { editingDetailsIds.add(id);    renderTable(getVisibleApplications()); }
function cancelEditDetails(id) { editingDetailsIds.delete(id); renderTable(getVisibleApplications()); }

async function saveDetails(id, buttonEl) {
    const input = document.getElementById(`details-input-${id}`);
    const orig  = buttonEl.innerText;
    buttonEl.innerText = 'Saving…'; buttonEl.disabled = true;
    try {
        const res = await fetch(`/api/applications/${id}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ details: input ? input.value : '' }),
        });
        if (!res.ok) throw await parseErrorResponse(res);
        editingDetailsIds.delete(id);
        await fetchApplications();
    } catch (error) {
        console.error('Update details error:', error);
        alert(`Failed to update details: ${error.message}`);
    } finally { buttonEl.innerText = orig; buttonEl.disabled = false; }
}

// ─── Delete ───────────────────────────────────────────────────────────────────
async function deleteApp(id) {
    if (!confirm('Are you sure you want to delete this record?')) return;
    try {
        const res = await fetch(`/api/applications/${id}`, { method: 'DELETE' });
        if (!res.ok) throw await parseErrorResponse(res);
        editingDetailsIds.delete(id);
        await fetchApplications();
    } catch (error) {
        console.error('Delete error:', error);
        alert(`Failed to delete: ${error.message}`);
    }
}

// ─── Export ───────────────────────────────────────────────────────────────────
function exportJSON() {
    if (!allApplications.length) { alert('No data to export.'); return; }
    downloadFile(JSON.stringify(allApplications, null, 2), `internships_${isoDateStamp()}.json`, 'application/json');
}

function exportCSV() {
    if (!allApplications.length) { alert('No data to export.'); return; }
    const headers = ['id', 'date_applied', 'company', 'title', 'location', 'link', 'status', 'details'];
    const csv     = [headers.join(','), ...allApplications.map((app) => headers.map((h) => csvCell(app[h] ?? '')).join(','))].join('\r\n');
    downloadFile(csv, `internships_${isoDateStamp()}.csv`, 'text/csv;charset=utf-8;');
}

// ─── CSV parser (state machine, handles quoted fields with newlines/commas) ───
function parseCSVText(text) {
    const rows    = [];
    let fields    = [];
    let field     = '';
    let inQuotes  = false;
    let i         = 0;

    const flush = () => { fields.push(field); field = ''; };

    while (i < text.length) {
        const ch   = text[i];
        const next = text[i + 1];

        if (inQuotes) {
            if (ch === '"' && next === '"') { field += '"'; i += 2; }       // escaped quote
            else if (ch === '"')            { inQuotes = false; i++; }      // closing quote
            else                            { field += ch; i++; }
        } else {
            if      (ch === '"')                      { inQuotes = true; i++; }
            else if (ch === ',')                      { flush(); i++; }
            else if (ch === '\r' && next === '\n')    { flush(); rows.push(fields); fields = []; i += 2; }
            else if (ch === '\n' || ch === '\r')      { flush(); rows.push(fields); fields = []; i++; }
            else                                      { field += ch; i++; }
        }
    }
    flush();
    if (fields.length > 1 || fields[0] !== '') rows.push(fields);

    if (rows.length < 2) return [];
    const headers = rows[0].map((h) => h.trim().toLowerCase());
    return rows.slice(1).map((values) => Object.fromEntries(headers.map((h, idx) => [h, values[idx] ?? ''])));
}

// ─── Import ───────────────────────────────────────────────────────────────────
document.getElementById('importFile').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    e.target.value = ''; // reset so the same file can be re-selected

    let rows;
    try {
        const text = await file.text();
        if (file.name.toLowerCase().endsWith('.json')) {
            const parsed = JSON.parse(text);
            rows = Array.isArray(parsed) ? parsed : [parsed];
        } else {
            rows = parseCSVText(text);
        }
    } catch (err) {
        showToast(`<span class="font-semibold text-red-600">Parse error:</span> ${escapeHTML(err.message)}`, true);
        return;
    }

    if (!rows.length) {
        showToast('<span class="text-red-600">File appears empty or has no data rows.</span>', true);
        return;
    }

    try {
        const res = await fetch('/api/import', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(rows),
        });
        const result = await res.json();

        if (!res.ok) {
            showToast(`<span class="font-semibold text-red-600">Import failed:</span> ${escapeHTML(result.error)}`, true);
            return;
        }

        let html = `<span class="font-semibold text-green-700">Import complete:</span> ${result.imported} imported`;
        if (result.skipped) html += `, ${result.skipped} skipped`;
        if (result.errors?.length) {
            html += `<ul class="mt-1 text-xs text-red-600 list-disc list-inside">`;
            result.errors.slice(0, 5).forEach((e) => { html += `<li>Row ${e.row}: ${escapeHTML(e.reason)}</li>`; });
            if (result.errors.length > 5) html += `<li>…and ${result.errors.length - 5} more</li>`;
            html += `</ul>`;
        }
        showToast(html, result.skipped > 0);
        await fetchApplications();
    } catch (err) {
        showToast(`<span class="font-semibold text-red-600">Network error:</span> ${escapeHTML(err.message)}`, true);
    }
});

// ─── Init ─────────────────────────────────────────────────────────────────────
async function init() {
    try {
        await fetchStatuses();         // 1. load status config from server
        initStatusSelect();            // 2. populate form select
        initStatusFilter();            // 3. populate filter select
        document.getElementById('statusFilter').addEventListener('change', () => renderTable(getVisibleApplications()));
        document.getElementById('sortBy').addEventListener('change',      () => renderTable(getVisibleApplications()));
        document.getElementById('searchInput').addEventListener('input',  () => renderTable(getVisibleApplications()));
        document.getElementById('date').valueAsDate = new Date();
        await fetchApplications();     // 4. load data
    } catch (err) {
        console.error('Init error:', err);
        alert('Failed to initialize. Please check if the server is running.');
    }
}

init();
</script>
